<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ENN Studio — Site Manager</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" type="image/png" href="/enn-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- ?v= forces browsers to fetch fresh copies. Bump when admin files change. -->
<link rel="stylesheet" href="/admin/admin.css?v=8">
<script src="/admin/config.js?v=8"></script>
<script src="/admin/schema.js?v=8"></script>
<script src="/admin/permissions.js?v=8"></script>
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>

<!-- ══ LOGIN ══ -->
<section class="login" id="login" hidden>
  <div class="login-card">
    <span class="tally" id="login-tally"><i></i>ENN STUDIO</span>
    <img class="login-logo" src="/enn-logo.png" alt="ENN"/>
    <div class="login-eyebrow">Site Manager · Staff Access</div>
    <h1>SIGN IN</h1>
    <p class="login-hint">Sign in with your ENN username and password to manage the site.</p>
    <form id="login-form" autocomplete="on">
      <input id="user" type="text" placeholder="Username" aria-label="Username" autocomplete="username" autocapitalize="off" spellcheck="false"/>
      <input id="pw" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password"/>
      <div class="login-err" id="login-err" style="display:none">Wrong username or password — try again</div>
      <button type="submit" id="login-btn">◉ Enter the Studio</button>
    </form>
    <a class="login-back" href="/">← Back to eastlakenewsnetwork.com</a>
  </div>
</section>

<!-- ══ APP ══ -->
<div class="app" id="app" hidden>
  <aside class="sidebar" id="sidebar">
    <a class="side-brand" href="#" id="home-link"><img src="/enn-logo.png" alt=""><b>ENN</b><span>CMS</span></a>
    <nav class="sidenav" id="sidenav"></nav>
    <div class="side-foot">
      <div class="user-chip" id="user-chip"></div>
      <a class="side-link" href="/" target="_blank" rel="noopener">View live site ↗</a>
      <button class="side-link" id="logout">Sign out</button>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="topbar">
      <button class="menu-toggle" id="menu-toggle" aria-label="Menu">☰</button>
      <div class="crumbs" id="crumbs"></div>
      <span class="save-state" id="save-state"></span>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div id="modal-root"></div>

<script src="/admin/athletics.js?v=8"></script>
<script src="/admin/app.js?v=8"></script>
</body>
</html>
